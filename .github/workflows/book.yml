# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: Book

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/book.yml
      - book/**

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install mdbook and mdbook-linkcheck
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook, mdbook-linkcheck
      - name: Build mdbook
        run: |
          mdbook build book
      - name: Archive book output
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: book
          path: book/book

  deploy:
    needs: build
    if: github.repository == 'sourcefrog/cargo-mutants' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency: # Allow one concurrent deployment
      group: "pages"
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook, mdbook-linkcheck
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build book
        run: |
          mdbook build book
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "book/book/html"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
